plugins {
    id 'net.fabricmc.fabric-loom' version '1.18-SNAPSHOT'
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    accessWidenerPath = file("src/main/resources/affogatocore.classtweaker")

    decompilerOptions.named("vineflower") {
        options.put("mark-corresponding-synthetics", "1")
    }

    runConfigs.configureEach {
        preferGradleTask = true
        generateRunConfig = true
    }
}

repositories {
    maven {url = "https://maven.terraformersmc.com/"}
    maven {url = "https://maven.fzzyhmstrs.me/"}
    maven {url = "https://maven.caffeinemc.net/releases"}
    maven {url = "https://api.modrinth.com/maven"}
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api}"

    implementation("maven.modrinth:mixson:${project.mixson}")
    implementation("com.moulberry:mixinconstraints:${project.mixinconstraints}")
    include("com.moulberry:mixinconstraints:${project.mixinconstraints}")

    implementation("com.terraformersmc:modmenu:${project.modmenu}")
    implementation("me.fzzyhmstrs:fzzy_config:${project.fzzy_config}")
    compileOnlyApi("net.caffeinemc:sodium-fabric-api:${project.sodium}")
    runtimeOnly("net.caffeinemc:sodium-fabric:${project.sodium}")
    compileOnly("maven.modrinth:iris:${project.iris}")
    compileOnly("maven.modrinth:farmers-delight-refabricated:${project.fdrf}")
    compileOnly("maven.modrinth:penchant:${project.penchant}")
    compileOnly("maven.modrinth:appleskin:${project.appleskin}")
    compileOnly("maven.modrinth:universal_ores:${project.universal_ores}")
}

processResources {
    def version = project.version
    def minecraft_version = project.minecraft_version
    def loader_version = project.loader_version

    inputs.property "version", version
    inputs.property "minecraft_version", minecraft_version
    inputs.property "loader_version", loader_version
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": version,
                "minecraft_version": minecraft_version,
                "loader_version": loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishMods {
    file = jar.archiveFile
    additionalFiles.from(sourcesJar.archiveFile)
    changelog = file("CHANGELOG.md").getText()
    type = STABLE
    modLoaders.add("fabric")
    displayName = "${project.mod_version}"

    modrinth {
        projectId = "Q8yzjHI3"
        accessToken = providers.environmentVariable("MR_KEY")
        minecraftVersions.add("26.3")
        environment = CLIENT_AND_SERVER
        requires("fabric-api", "fzzy-config", "mixson")
        optional("modmenu")
    }
}
